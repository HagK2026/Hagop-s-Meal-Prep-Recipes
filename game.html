<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>Hop Runner 3D</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fd3ff;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 16px;
    font-weight: 800; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,.45); pointer-events: none;
  }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: calc(8px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));
    text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); font-weight: 900; letter-spacing: 1px; }
  #overlay p { margin: 0 16px 6px; font-size: clamp(14px, 3.6vw, 18px); font-weight: 500; line-height: 1.4; }
  #overlay .hint { font-size: 22px; font-weight: 800; animation: pulse 1.2s ease-in-out infinite; }
  #overlay.dead { background: rgba(27,42,65,.45); }
  @keyframes pulse { 50% { opacity: .45; } }
  #jump {
    position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.6);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: .5px;
  }
  #jump.on { background: rgba(255,255,255,.45); }
  #stickBase, #stickKnob { position: fixed; border-radius: 50%; pointer-events: none; display: none; }
  #stickBase { width: 120px; height: 120px; margin: -60px 0 0 -60px; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.5); }
  #stickKnob { width: 56px; height: 56px; margin: -28px 0 0 -28px; background: rgba(255,255,255,.55); }
  #moveHint {
    position: fixed; left: 24px; bottom: calc(40px + env(safe-area-inset-bottom));
    font-size: 14px; font-weight: 700; opacity: .8; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  body.menu #hud, body.menu #jump, body.menu #moveHint { display: none; }
  @media (hover: hover) and (pointer: fine) { #jump, #moveHint { display: none; } }
</style>
</head>
<body class="menu">
<div id="hud"></div>
<div id="overlay">
  <h1 id="ovTitle">HOP RUNNER</h1>
  <div>
    <p id="ovSub">Drag on the left side to move &middot; JUMP to hop<br>Dodge the spikes, don't fall, grab the coins</p>
    <div class="hint" id="ovHint">Tap to start</div>
  </div>
</div>
<div id="moveHint">&#8592; drag here to move</div>
<div id="jump">JUMP</div>
<div id="stickBase"></div><div id="stickKnob"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- Renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const SKY = 0x8fd3ff;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 28, 70);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);
  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    // keep a decent field of view in portrait
    camera.fov = camera.aspect < 1 ? 70 : 55;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a8a5a, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(4, 10, 6); scene.add(sun);

  // toon shading ramp
  const ramp = new THREE.DataTexture(new Uint8Array([95, 170, 230]), 3, 1, THREE.LuminanceFormat);
  ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
  const matCache = {};
  function toon(color, extra) {
    const key = color + (extra ? JSON.stringify(extra) : '');
    if (!matCache[key]) matCache[key] = new THREE.MeshToonMaterial(Object.assign({ color, gradientMap: ramp }, extra || {}));
    return matCache[key];
  }

  // water far below
  const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), toon(0x3d9ad1));
  water.rotation.x = -Math.PI / 2; water.position.y = -12; scene.add(water);

  // ---------- Cartoon player ----------
  const C = {
    skin: 0xf2c4a0, skinDark: 0xe0a882, hair: 0x7b4a2a, hairLight: 0x9a6038,
    beard: 0xb3622e, tee: 0x9b8572, shirt: 0xb4c4cf, jeans: 0x3b4556, shoe: 0x4a3426,
    gold: 0xd9a92b, black: 0x1d1d22, beer: 0xe0962a, foam: 0xfff8e8,
  };
  function mesh(geo, color, x = 0, y = 0, z = 0, extra) {
    const m = new THREE.Mesh(geo, toon(color, extra)); m.position.set(x, y, z); return m;
  }

  function buildHero() {
    const hero = new THREE.Group();
    const body = new THREE.Group(); hero.add(body);

    // legs (pivot at hip)
    const legs = [];
    for (const sx of [-1, 1]) {
      const pivot = new THREE.Group(); pivot.position.set(0.14 * sx, 0.58, 0);
      pivot.add(mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.5, 12), C.jeans, 0, -0.26, 0));
      const shoe = mesh(new THREE.BoxGeometry(0.22, 0.12, 0.34), C.shoe, 0, -0.52, 0.05);
      pivot.add(shoe);
      body.add(pivot); legs.push(pivot);
    }
    // torso: tee + open shirt
    body.add(mesh(new THREE.CylinderGeometry(0.29, 0.31, 0.62, 20), C.tee, 0, 0.88, 0));
    const shirt = mesh(new THREE.CylinderGeometry(0.315, 0.335, 0.64, 24, 1, true, 0.42, Math.PI * 2 - 0.84), C.shirt, 0, 0.87, 0, { side: THREE.DoubleSide });
    body.add(shirt);
    // collar flaps
    for (const sx of [-1, 1]) {
      const flap = mesh(new THREE.BoxGeometry(0.12, 0.16, 0.04), C.shirt, 0.15 * sx, 1.13, 0.25);
      flap.rotation.z = 0.5 * sx; flap.rotation.x = -0.3; body.add(flap);
    }
    // gold chain + coin pendant
    const chain = mesh(new THREE.TorusGeometry(0.16, 0.012, 6, 24, Math.PI), C.gold, 0, 1.12, 0.27);
    chain.rotation.z = Math.PI; chain.rotation.x = -0.25; body.add(chain);
    const coin = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.015, 16), C.gold, 0, 0.94, 0.31);
    coin.rotation.x = Math.PI / 2; body.add(coin);
    // neck
    body.add(mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.14, 12), C.skin, 0, 1.2, 0));

    // arms (pivot at shoulder)
    const arms = [];
    for (const sx of [-1, 1]) {
      const pivot = new THREE.Group(); pivot.position.set(0.39 * sx, 1.1, 0);
      pivot.add(mesh(new THREE.CylinderGeometry(0.095, 0.085, 0.5, 12), C.shirt, 0, -0.24, 0));
      pivot.add(mesh(new THREE.SphereGeometry(0.09, 12, 10), C.skin, 0, -0.53, 0));
      if (sx === -1) { // black watch on left wrist
        pivot.add(mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.07, 14), C.black, 0, -0.44, 0));
      } else { // a pint in the right hand
        const pint = new THREE.Group(); pint.position.set(0, -0.56, 0.1);
        pint.add(mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.22, 14), C.beer, 0, 0, 0, { transparent: true, opacity: 0.9 }));
        pint.add(mesh(new THREE.CylinderGeometry(0.078, 0.076, 0.05, 14), C.foam, 0, 0.13, 0));
        pivot.add(pint);
      }
      body.add(pivot); arms.push(pivot);
    }

    // head
    const head = new THREE.Group(); head.position.set(0, 1.62, 0); body.add(head);
    const skull = mesh(new THREE.SphereGeometry(0.36, 24, 20), C.skin); skull.scale.set(1, 1.08, 0.95); head.add(skull);
    for (const sx of [-1, 1]) {
      const ear = mesh(new THREE.SphereGeometry(0.07, 10, 8), C.skin, 0.35 * sx, 0, 0); ear.scale.set(0.5, 1, 0.8); head.add(ear);
    }
    // hair: short cap on sides/back + big swept-up quiff on top
    const cap = mesh(new THREE.SphereGeometry(0.375, 24, 16, 0, Math.PI * 2, 0, 1.2), C.hair);
    cap.rotation.x = -0.45; cap.position.y = 0.04; cap.scale.set(1, 1.05, 0.98); head.add(cap);
    const quiff = mesh(new THREE.SphereGeometry(0.26, 18, 14), C.hairLight, 0, 0.33, 0.02);
    quiff.scale.set(1.25, 0.62, 1.15); quiff.rotation.x = -0.35; head.add(quiff);
    const quiffFront = mesh(new THREE.SphereGeometry(0.15, 14, 10), C.hairLight, 0.03, 0.36, 0.2);
    quiffFront.scale.set(1.5, 0.7, 1); quiffFront.rotation.x = -0.6; head.add(quiffFront);
    // beard: jaw shell + chin + sideburns + moustache
    const jaw = mesh(new THREE.SphereGeometry(0.378, 24, 14, Math.PI / 2 - 1.75, 3.5, 1.6, 1.2), C.beard);
    jaw.scale.set(1, 1.08, 0.97); head.add(jaw);
    const chin = mesh(new THREE.SphereGeometry(0.2, 14, 10), C.beard, 0, -0.3, 0.14); chin.scale.set(1.1, 0.8, 0.9); head.add(chin);
    for (const sx of [-1, 1]) {
      head.add(mesh(new THREE.BoxGeometry(0.06, 0.2, 0.12), C.beard, 0.335 * sx, -0.06, 0.06));
      const mo = mesh(new THREE.SphereGeometry(0.075, 12, 8), C.beard, 0.075 * sx, -0.11, 0.32);
      mo.scale.set(1.5, 0.6, 0.8); mo.rotation.z = -0.35 * sx; head.add(mo);
    }
    head.add(mesh(new THREE.SphereGeometry(0.065, 12, 10), C.skinDark, 0, -0.01, 0.35)); // nose
    // big wide eyes + raised brows
    for (const sx of [-1, 1]) {
      head.add(mesh(new THREE.SphereGeometry(0.068, 14, 10), 0xffffff, 0.13 * sx, 0.07, 0.29));
      head.add(mesh(new THREE.SphereGeometry(0.036, 10, 8), 0x3a2a20, 0.13 * sx, 0.07, 0.35));
      const brow = mesh(new THREE.BoxGeometry(0.14, 0.03, 0.03), C.hair, 0.13 * sx, sx < 0 ? 0.21 : 0.19, 0.32);
      brow.rotation.z = sx < 0 ? 0.25 : -0.05; head.add(brow);
    }
    // round wire glasses
    for (const sx of [-1, 1]) {
      head.add(mesh(new THREE.TorusGeometry(0.105, 0.012, 6, 24), C.black, 0.13 * sx, 0.06, 0.37));
      head.add(mesh(new THREE.BoxGeometry(0.012, 0.012, 0.36), C.black, 0.25 * sx, 0.08, 0.2));
    }
    const bridge = mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.06, 6), C.black, 0, 0.09, 0.38);
    bridge.rotation.z = Math.PI / 2; head.add(bridge);

    hero.userData = { body, legs, arms, head };
    return hero;
  }
  const hero = buildHero(); scene.add(hero);

  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.4, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; scene.add(blob);

  // ---------- World ----------
  let solids = [], spikes = [], coins = [], genZ = 0, lastX = 0, lastTop = 0;
  const world = new THREE.Group(); scene.add(world);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function addSolid(x, z, w, d, top, h, kind) {
    let m;
    if (kind === 'crate') {
      m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(0xc98b4f));
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x7a4f2e }));
      m.add(edges);
      const x1 = new THREE.Mesh(new THREE.BoxGeometry(w * 1.01, h * 0.14, d * 1.01), toon(0x9c6438)); m.add(x1);
    } else {
      const side = toon(0x8a5a3b), grass = toon(0x4fa845);
      m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, grass, side, side, side]);
      const lip = new THREE.Mesh(new THREE.BoxGeometry(w + 0.06, 0.18, d + 0.06), toon(0x3f9a3c));
      lip.position.y = h / 2 - 0.09; m.add(lip);
    }
    m.position.set(x, top - h / 2, z); world.add(m);
    const s = { x, z, w, d, top, bottom: top - h, mesh: m };
    solids.push(s); return s;
  }
  function addPlatform(x, zNear, w, d, top) {
    const s = addSolid(x, zNear - d / 2, w, d, top, 2.2, 'ground');
    genZ = zNear - d; lastX = x; lastTop = top; return s;
  }
  function addSpikes(x, z, w, d, top) {
    const g = new THREE.Group();
    const plate = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, d), toon(0x555b66)); plate.position.y = 0.03; g.add(plate);
    const cone = new THREE.ConeGeometry(0.17, 0.55, 6);
    for (let ix = -w / 2 + 0.25; ix <= w / 2 - 0.2; ix += 0.45)
      for (let iz = -d / 2 + 0.25; iz <= d / 2 - 0.2; iz += 0.45) {
        const c = new THREE.Mesh(cone, toon(0xc9d1d9)); c.position.set(ix, 0.3, iz); g.add(c);
      }
    g.position.set(x, top, z); world.add(g);
    spikes.push({ x, z, w, d, top, mesh: g });
  }
  const coinGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.08, 20);
  function addCoin(x, y, z) {
    const m = new THREE.Mesh(coinGeo, toon(0xffcc33)); m.rotation.x = Math.PI / 2;
    const holder = new THREE.Group(); holder.add(m); holder.position.set(x, y, z); world.add(holder);
    coins.push({ x, y, z, mesh: holder, got: false });
  }

  function generate() {
    const diff = clamp(-genZ / 400, 0, 1);
    const r = Math.random();
    if (r < 0.3) { // gap jump
      const gap = rnd(1.8, 2.6 + diff * 1.0);
      const top = clamp(lastTop + [-0.5, 0, 0, 0.5][Math.floor(Math.random() * 4)], -1, 1.5);
      const x = clamp(lastX + rnd(-2, 2), -4, 4);
      addCoin((x + lastX) / 2, Math.max(top, lastTop) + 1.6, genZ - gap / 2);
      addPlatform(x, genZ - gap, rnd(3.5, 6), rnd(6, 10), top);
    } else if (r < 0.55) { // spike field with a way around
      const zNear = genZ - rnd(1.6, 2.4);
      const w = 7, x = clamp(lastX + rnd(-1, 1), -3, 3), top = lastTop;
      addPlatform(x, zNear, w, 13, top);
      const side = Math.random() < 0.5 ? -1 : 1;
      addSpikes(x - side * 1.0, zNear - 4, 5, 1.3, top);
      if (Math.random() < 0.4 + diff * 0.5) addSpikes(x + side * 1.0, zNear - 9, 5, 1.3, top);
      else addSpikes(x, zNear - 9, 2.5 + diff * 2.5, 1.3, top);
      addCoin(x, top + 1.7, zNear - 4); addCoin(x, top + 1.7, zNear - 9);
    } else if (r < 0.75) { // crates
      const zNear = genZ - rnd(1.6, 2.4);
      const x = clamp(lastX + rnd(-1, 1), -3, 3), top = lastTop;
      addPlatform(x, zNear, 6.5, 11, top);
      const n = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        const cx = x + rnd(-2.2, 2.2), cz = zNear - 3 - i * 2.6;
        addSolid(cx, cz, 1.2, 1.2, top + 1.2, 1.2, 'crate');
        if (i === n - 1) addCoin(cx, top + 2.4, cz);
      }
    } else { // stepping stones
      const count = 3 + Math.floor(Math.random() * 3);
      let x = lastX, top = lastTop;
      for (let i = 0; i < count; i++) {
        const gap = rnd(1.2, 1.8 + diff * 0.6);
        x = clamp(x + rnd(-2.2, 2.2), -4.5, 4.5);
        top = clamp(top + rnd(-0.4, 0.5), -1, 2);
        addPlatform(x, genZ - gap, 1.9, 1.9, top);
        if (i === count - 1) addCoin(x, top + 1.4, genZ + 0.95);
      }
      addPlatform(clamp(x + rnd(-1, 1), -3, 3), genZ - rnd(1.4, 2), 5, 6, top);
    }
  }

  function clearWorld() {
    for (const o of [...solids, ...spikes, ...coins]) world.remove(o.mesh);
    solids = []; spikes = []; coins = [];
  }

  // ---------- Player state ----------
  const R = 0.32, HEIGHT = 1.9, SPEED = 6.2, GRAV = 28, JUMP_V = 10.5;
  const p = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, onGround: true, yaw: 0, phase: 0 };
  let state = 'title', score = 0, coinCount = 0, best = 0, deadTime = 0, coyote = 0, jumpBuf = 0, t = 0;
  try { best = +localStorage.getItem('hopRunner3dBest') || 0; } catch (e) {}
  const camPos = new THREE.Vector3(0.5, 1.6, 5.2), camLook = new THREE.Vector3(0, 1.15, 0);

  function reset() {
    clearWorld();
    genZ = 4; lastX = 0; lastTop = 0;
    addPlatform(0, 4, 6, 14, 0);
    while (genZ > -80) generate();
    Object.assign(p, { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, onGround: true, yaw: 0 });
    score = 0; coinCount = 0; coyote = 0; jumpBuf = 0;
  }
  reset();

  // ---------- Input ----------
  const input = { mx: 0, mz: 0, jump: false, jumpPressed: false };
  const keys = {};
  const stickBase = document.getElementById('stickBase'), stickKnob = document.getElementById('stickKnob');
  const jumpBtn = document.getElementById('jump'), moveHint = document.getElementById('moveHint');
  let stickId = null, stickX = 0, stickY = 0, stickDX = 0, stickDY = 0;

  function pressJump() { if (!input.jump) input.jumpPressed = true; input.jump = true; }
  jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); pressJump(); jumpBtn.classList.add('on'); });
  const jumpUp = e => { input.jump = false; jumpBtn.classList.remove('on'); };
  jumpBtn.addEventListener('pointerup', jumpUp); jumpBtn.addEventListener('pointercancel', jumpUp); jumpBtn.addEventListener('pointerleave', jumpUp);

  window.addEventListener('pointerdown', e => {
    if (state !== 'play') { input.jumpPressed = true; return; }
    if (e.pointerType === 'mouse') return;
    if (e.clientX < window.innerWidth * 0.6 && stickId === null) {
      stickId = e.pointerId; stickX = e.clientX; stickY = e.clientY; stickDX = stickDY = 0;
      stickBase.style.display = stickKnob.style.display = 'block';
      stickBase.style.left = stickKnob.style.left = stickX + 'px';
      stickBase.style.top = stickKnob.style.top = stickY + 'px';
      moveHint.style.display = 'none';
    } else if (stickId !== e.pointerId) pressJump();
  });
  window.addEventListener('pointermove', e => {
    if (e.pointerId !== stickId) return;
    let dx = e.clientX - stickX, dy = e.clientY - stickY;
    const len = Math.hypot(dx, dy), max = 55;
    if (len > max) { dx *= max / len; dy *= max / len; }
    stickDX = dx / max; stickDY = dy / max;
    stickKnob.style.left = (stickX + dx) + 'px'; stickKnob.style.top = (stickY + dy) + 'px';
  });
  const endStick = e => {
    if (e.pointerId === stickId) { stickId = null; stickDX = stickDY = 0; stickBase.style.display = stickKnob.style.display = 'none'; }
    else if (e.pointerType !== 'mouse') input.jump = jumpBtn.classList.contains('on');
  };
  window.addEventListener('pointerup', endStick); window.addEventListener('pointercancel', endStick);

  const keyMap = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'f', w: 'f', W: 'f', ArrowDown: 'b', s: 'b', S: 'b' };
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); if (state !== 'play') input.jumpPressed = true; else pressJump(); return; }
    if (keyMap[e.key]) { e.preventDefault(); keys[keyMap[e.key]] = true; }
  });
  window.addEventListener('keyup', e => {
    if (e.key === ' ') input.jump = false;
    if (keyMap[e.key]) keys[keyMap[e.key]] = false;
  });

  function readMove() {
    let mx = stickDX, mz = stickDY;
    if (keys.l) mx -= 1; if (keys.r) mx += 1; if (keys.f) mz -= 1; if (keys.b) mz += 1;
    const len = Math.hypot(mx, mz);
    if (len > 1) { mx /= len; mz /= len; }
    input.mx = mx; input.mz = mz;
  }

  // ---------- UI ----------
  const hud = document.getElementById('hud'), overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle'), ovSub = document.getElementById('ovSub'), ovHint = document.getElementById('ovHint');
  function showOverlay(kind) {
    overlay.classList.remove('hidden'); document.body.classList.add('menu');
    overlay.classList.toggle('dead', kind === 'dead');
    if (kind === 'dead') {
      const s = Math.floor(score) + coinCount * 10;
      ovTitle.textContent = 'OUCH!';
      ovSub.innerHTML = `Score ${s} &nbsp;(${Math.floor(score)} m + ${coinCount}&times;10)<br>Best ${best}`;
      ovHint.textContent = 'Tap to retry';
    }
  }

  function die() {
    state = 'dead'; deadTime = 0;
    const s = Math.floor(score) + coinCount * 10;
    if (s > best) { best = s; try { localStorage.setItem('hopRunner3dBest', best); } catch (e) {} }
    try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
    showOverlay('dead');
  }

  // ---------- Physics ----------
  const overlapXZ = (s, shrink) => Math.abs(p.x - s.x) < s.w / 2 + R - shrink && Math.abs(p.z - s.z) < s.d / 2 + R - shrink;

  function step(dt) {
    readMove();
    const tvx = input.mx * SPEED, tvz = input.mz * SPEED;
    const k = Math.min(1, dt * (p.onGround ? 14 : 6));
    p.vx += (tvx - p.vx) * k; p.vz += (tvz - p.vz) * k;

    coyote = p.onGround ? 0.1 : coyote - dt;
    jumpBuf = input.jumpPressed ? 0.12 : jumpBuf - dt;
    input.jumpPressed = false;
    if (jumpBuf > 0 && coyote > 0) { p.vy = JUMP_V; p.onGround = false; coyote = 0; jumpBuf = 0; }
    if (!input.jump && p.vy > 4) p.vy = 4; // short hop on tap
    p.vy -= GRAV * dt;

    // horizontal, one axis at a time
    for (const axis of ['x', 'z']) {
      const v = axis === 'x' ? p.vx : p.vz;
      p[axis] += v * dt;
      for (const s of solids) {
        if (p.y < s.top - 0.05 && p.y + HEIGHT > s.bottom && overlapXZ(s, 0)) {
          const half = (axis === 'x' ? s.w : s.d) / 2;
          if (v > 0) p[axis] = s[axis] - half - R; else if (v < 0) p[axis] = s[axis] + half + R;
          if (axis === 'x') p.vx = 0; else p.vz = 0;
        }
      }
    }
    // vertical
    const prevY = p.y;
    p.y += p.vy * dt; p.onGround = false;
    for (const s of solids) {
      if (p.vy <= 0 && prevY >= s.top - 0.001 && p.y <= s.top && overlapXZ(s, R * 0.5)) {
        p.y = s.top; p.vy = 0; p.onGround = true;
      }
    }

    for (const sp of spikes) {
      if (Math.abs(p.x - sp.x) < sp.w / 2 + R * 0.5 && Math.abs(p.z - sp.z) < sp.d / 2 + R * 0.5 && p.y < sp.top + 0.45 && p.y > sp.top - 0.5) return die();
    }
    if (p.y < -8) return die();

    for (const c of coins) {
      if (!c.got && Math.hypot(p.x - c.x, p.y + 0.9 - c.y, p.z - c.z) < 0.95) { c.got = true; coinCount++; world.remove(c.mesh); }
    }
    score = Math.max(score, -p.z);
  }

  function update(dt) {
    if (state === 'title' || state === 'dead') {
      deadTime += dt;
      if (input.jumpPressed && (state === 'title' || deadTime > 0.5)) {
        if (state === 'dead') reset();
        state = 'play'; overlay.classList.add('hidden'); document.body.classList.remove('menu');
      }
      input.jumpPressed = false;
      if (state === 'dead') { p.vy -= GRAV * dt; p.y = Math.max(p.y + p.vy * dt, -20); }
      return;
    }
    const n = 3;
    for (let i = 0; i < n && state === 'play'; i++) step(dt / n);

    while (genZ > p.z - 80) generate();
    const cut = p.z + 25;
    const keep = o => { if (o.z - (o.d || 0) / 2 > cut) { world.remove(o.mesh); return false; } return true; };
    solids = solids.filter(keep); spikes = spikes.filter(keep); coins = coins.filter(keep);
  }

  // ---------- Animation / camera ----------
  function animateHero(dt) {
    const { legs, arms, head, body } = hero.userData;
    const speed = Math.hypot(p.vx, p.vz);
    if (state === 'play' && speed > 0.6) {
      const target = Math.atan2(p.vx, p.vz);
      let d = target - p.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      p.yaw += d * Math.min(1, dt * 12);
    } else if (state === 'title') {
      p.yaw = Math.sin(t * 0.8) * 0.35;
    }
    hero.position.set(p.x, p.y, p.z);
    hero.rotation.y = p.yaw;

    if (state === 'play' && !p.onGround) {
      legs[0].rotation.x = 0.6; legs[1].rotation.x = -0.4;
      arms[0].rotation.x = -2.2; arms[0].rotation.z = -0.3;
      arms[1].rotation.x = -0.9; arms[1].rotation.z = 0.2;
      body.position.y = 0;
    } else {
      p.phase += speed * dt * 2.3;
      const amt = Math.min(1, speed / SPEED);
      const sw = Math.sin(p.phase) * 0.8 * amt;
      legs[0].rotation.x = sw; legs[1].rotation.x = -sw;
      arms[0].rotation.x = -sw * 0.9; arms[0].rotation.z = -0.08;
      // right arm keeps the pint mostly level
      arms[1].rotation.x = state === 'title' ? -1.2 + Math.sin(t * 2) * 0.15 : -0.5 + sw * 0.3;
      arms[1].rotation.z = 0.08;
      body.position.y = Math.abs(Math.cos(p.phase)) * 0.06 * amt + (state === 'title' ? Math.sin(t * 2) * 0.02 : 0);
    }
    head.rotation.z = state === 'title' ? Math.sin(t * 1.3) * 0.08 : 0;

    // blob shadow on the highest surface underneath
    let ground = -99;
    for (const s of solids) if (s.top <= p.y + 0.05 && overlapXZ(s, R)) ground = Math.max(ground, s.top);
    blob.visible = ground > -99;
    if (blob.visible) {
      blob.position.set(p.x, ground + 0.02, p.z);
      const sc = clamp(1 - (p.y - ground) * 0.12, 0.4, 1); blob.scale.set(sc, sc, sc);
    }
  }

  function updateCamera(dt) {
    let tp, tl;
    if (state === 'title') {
      tp = new THREE.Vector3(p.x + 0.5, 1.6, p.z + 5.2);
      tl = new THREE.Vector3(p.x, 1.15, p.z);
    } else {
      const fy = Math.max(p.y, -2);
      tp = new THREE.Vector3(p.x * 0.7, fy + 5.2, p.z + 7.5);
      tl = new THREE.Vector3(p.x * 0.85, fy + 0.8, p.z - 4);
    }
    const k = Math.min(1, dt * 5);
    camPos.lerp(tp, k); camLook.lerp(tl, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
    water.position.x = p.x; water.position.z = p.z - 40;
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
    update(dt);
    animateHero(dt);
    updateCamera(dt);
    for (const c of coins) { c.mesh.rotation.y += dt * 3; c.mesh.position.y = c.y + Math.sin(t * 3 + c.z) * 0.12; }
    hud.textContent = `${Math.floor(score)} m   ● ${coinCount}   Best ${best}`;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
